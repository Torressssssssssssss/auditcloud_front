map $http_upgrade $conexion_actualizada {
    default upgrade;
    '' close;
}

#Redirigir trafico HTTP a HTTPS manteniendo la ruta de salud para Docker
server {
    listen 80;
    server_name 157.230.189.205 _;

    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

#Servidor principal en HTTPS
server {
    listen 443 ssl;
    server_name 157.230.189.205 _;

    ssl_certificate /etc/letsencrypt/live/157.230.189.205/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/157.230.189.205/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $servidor_backend http://backend:3000;

    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location /api/socket.io/ {
        proxy_pass $servidor_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexion_actualizada;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }

    location /api/ {
        proxy_pass $servidor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass $servidor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control 'no-store' always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
