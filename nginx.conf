map $http_upgrade $conexion_actualizada {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name auditcloud.site;

    ssl_certificate /etc/letsencrypt/live/auditcloud.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auditcloud.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $servidor_backend http://backend:3000;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location /api/socket.io/ {
        proxy_pass $servidor_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexion_actualizada;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }

    location /api/ {
        proxy_pass $servidor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass $servidor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control 'no-store' always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name auditcloud.site www.auditcloud.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 301 https://auditcloud.site$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.auditcloud.site;

    ssl_certificate /etc/letsencrypt/live/auditcloud.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auditcloud.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://auditcloud.site$request_uri;
}
